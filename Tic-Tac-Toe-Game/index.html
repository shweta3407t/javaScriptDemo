<body>

     <div class="drawHide hide"  >
        <p id="drawMessage"></p>
        <button id="draw">Start again</button>
    </div>



 

    <div id="container">
        <div id="game">
            <button class="box" ></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
        </div>
    </div>


    <button id="reset">Reset Game</button>
    

    <script src="app.js"></script>
</body>
